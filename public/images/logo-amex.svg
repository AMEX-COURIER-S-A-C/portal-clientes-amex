<?xml version="1.0" encoding="utf-8"?>
<svg version="1.2" baseProfile="tiny-ps" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>AMEX Courier</title>
  <desc>Logo oficial de AMEX Courier S.A.C. para BIMI</desc>
  <defs>
    <linearGradient id="amexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="amexOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="50%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#f4511e"/>
    </linearGradient>
    <linearGradient id="amexGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffca28"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular corporativo para avatar -->
  <rect width="512" height="512" rx="100" fill="url(#amexBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ff5722" stroke-width="6" opacity="0.4"/>

  <!-- Símbolo de Vuelo / Avión Express -->
  <g transform="translate(355, 172) rotate(18) scale(1.15)">
    <!-- Avión estilizado AMEX -->
    <path d="M 0,-24 L 6,-6 L 30,-2 L 6,6 L 12,22 L 0,16 L -12,22 L -6,6 L -30,-2 L -6,-6 Z" fill="url(#amexGold)"/>
  </g>

  <!-- Logotipo Texto AMEX -->
  <g transform="translate(42, 280)">
    <!-- Letra A -->
    <path d="M 40,0 L 78,-105 L 110,-105 L 148,0 L 116,0 L 105,-32 L 68,-32 L 58,0 Z M 76,-56 L 97,-56 L 86,-88 Z" fill="url(#amexOrange)"/>
    
    <!-- Letra M -->
    <path d="M 152,0 L 178,-105 L 208,-105 L 226,-45 L 244,-105 L 274,-105 L 300,0 L 272,0 L 258,-62 L 238,0 L 214,0 L 194,-62 L 180,0 Z" fill="url(#amexOrange)"/>
    
    <!-- Letra E -->
    <path d="M 306,0 L 332,-105 L 400,-105 L 394,-80 L 354,-80 L 349,-60 L 385,-60 L 379,-35 L 343,-35 L 336,-25 L 380,-25 L 374,0 Z" fill="url(#amexOrange)"/>
    
    <!-- Letra X -->
    <path d="M 402,0 L 434,-52 L 398,-105 L 430,-105 L 452,-70 L 474,-105 L 504,-105 L 468,-52 L 502,0 L 470,0 L 450,-33 L 430,0 Z" fill="url(#amexOrange)"/>
  </g>

  <!-- Subtítulo COURIER -->
  <text x="256" y="348" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="14">COURIER</text>
  
  <!-- Línea decorativa inferior -->
  <rect x="146" y="375" width="220" height="4" rx="2" fill="url(#amexGold)"/>
</svg>
